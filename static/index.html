<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Historical RAG - Search Witness Testimonies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .search-form {
            display: grid;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2a5298;
        }

        input[type="text"], select, input[type="number"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #2a5298;
        }

        .search-btn {
            padding: 12px 30px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-btn:hover {
            background: #1e3c72;
        }

        .search-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        .results-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2a5298;
        }

        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #2a5298;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 5px 5px 0;
        }

        .result-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .witness-info {
            flex-grow: 1;
        }

        .witness-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 5px;
        }

        .metadata {
            color: #666;
            font-size: 0.9rem;
        }

        .scores {
            text-align: right;
            font-size: 0.9rem;
        }

        .score {
            background: #2a5298;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 5px;
        }

        .content {
            font-size: 1rem;
            line-height: 1.8;
            margin: 15px 0;
            white-space: pre-wrap;
        }

        .explanation {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            font-style: italic;
            color: #495057;
            border-left: 3px solid #6c757d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #dc3545;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .system-status {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .scores {
                text-align: left;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚓ Titanic Historical RAG</h1>
            <p>Search primary historical documents and witness testimonies from the 1912 disaster</p>
        </div>

        <div class="system-status" id="systemStatus">
            <span id="statusText">Checking system status...</span>
        </div>

        <div class="search-container">
            <form class="search-form" id="searchForm">
                <div class="form-group full-width">
                    <label for="query">Search Query</label>
                    <input type="text" id="query" name="query" placeholder="e.g., 'lifeboat procedures', 'band playing', 'collision details'" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="witnessName">Filter by Witness (optional)</label>
                        <select id="witnessName" name="witnessName">
                            <option value="">All witnesses</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sourceType">Filter by Source (optional)</label>
                        <select id="sourceType" name="sourceType">
                            <option value="">All sources</option>
                            <option value="us_inquiry">US Senate Inquiry</option>
                            <option value="british_inquiry">British Inquiry</option>
                            <option value="other">Other Sources</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="topK">Number of Results</label>
                        <select id="topK" name="topK">
                            <option value="5">5 results</option>
                            <option value="10">10 results</option>
                            <option value="15">15 results</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="threshold">Similarity Threshold</label>
                        <select id="threshold" name="threshold">
                            <option value="0.3">Very Low (0.3) - All results</option>
                            <option value="0.4" selected>Low (0.4) - More results</option>
                            <option value="0.5">Medium (0.5) - Balanced</option>
                            <option value="0.6">High (0.6) - Most relevant</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="search-btn" id="searchBtn">
                        🔍 Search Historical Documents
                    </button>
                </div>
            </form>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="results-header">
                <h2 id="resultsTitle">Search Results</h2>
                <p id="resultsCount"></p>
            </div>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        // Global variables
        let availableWitnesses = [];

        // Initialize the application
        async function initApp() {
            await checkSystemHealth();
            await loadAvailableDocuments();
        }

        // Check system health
        async function checkSystemHealth() {
            const statusElement = document.getElementById('statusText');
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (response.ok) {
                    statusElement.innerHTML = `✅ System operational | ${data.total_documents} documents indexed`;
                    statusElement.parentElement.style.background = 'rgba(40, 167, 69, 0.2)';
                } else {
                    throw new Error(data.detail || 'Unknown error');
                }
            } catch (error) {
                statusElement.innerHTML = `❌ System error: ${error.message}`;
                statusElement.parentElement.style.background = 'rgba(220, 53, 69, 0.2)';
            }
        }

        // Load available documents and populate filters
        async function loadAvailableDocuments() {
            try {
                const response = await fetch('/documents');
                const data = await response.json();
                
                // Populate witness filter
                const witnessSelect = document.getElementById('witnessName');
                availableWitnesses = data.unique_witnesses || [];
                
                availableWitnesses.forEach(witness => {
                    const option = document.createElement('option');
                    option.value = witness;
                    option.textContent = witness;
                    witnessSelect.appendChild(option);
                });
                
            } catch (error) {
                console.error('Failed to load documents:', error);
            }
        }

        // Handle form submission
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await performSearch();
        });

        // Perform search
        async function performSearch() {
            const query = document.getElementById('query').value.trim();
            if (!query) {
                alert('Please enter a search query');
                return;
            }

            // Show loading state
            const searchBtn = document.getElementById('searchBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsContent = document.getElementById('resultsContent');
            
            searchBtn.disabled = true;
            searchBtn.innerHTML = '🔍 Searching...';
            
            resultsContainer.style.display = 'block';
            resultsContent.innerHTML = '<div class="loading">Searching historical documents...</div>';

            try {
                // Build search request
                const searchRequest = {
                    query: query,
                    top_k: parseInt(document.getElementById('topK').value),
                    similarity_threshold: parseFloat(document.getElementById('threshold').value),
                    witness_name: document.getElementById('witnessName').value || null,
                    source_type: document.getElementById('sourceType').value || null
                };

                // Perform search
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(searchRequest)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Search failed');
                }

                displayResults(data);

            } catch (error) {
                resultsContent.innerHTML = `<div class="error">Search failed: ${error.message}</div>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '🔍 Search Historical Documents';
            }
        }

        // Display search results
        function displayResults(data) {
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsCount = document.getElementById('resultsCount');
            const resultsContent = document.getElementById('resultsContent');

            resultsTitle.textContent = `Search Results for "${data.query}"`;
            resultsCount.textContent = `Found ${data.total_results} relevant testimonies`;

            if (data.results.length === 0) {
                resultsContent.innerHTML = `
                    <div class="no-results">
                        <h3>No matching testimonies found</h3>
                        <p>Try adjusting your search terms or lowering the similarity threshold</p>
                    </div>
                `;
                return;
            }

            // Display results
            const resultsHtml = data.results.map((result, index) => `
                <div class="result-item">
                    <div class="result-header">
                        <div class="witness-info">
                            <div class="witness-name">${result.witness_name}</div>
                            <div class="metadata">
                                ${result.source_type.replace('_', ' ').toUpperCase()} | Page ${result.page_number}
                            </div>
                        </div>
                        <div class="scores">
                            <span class="score">Similarity: ${result.similarity_score}</span>
                            <span class="score">Relevance: ${result.relevance_score}</span>
                        </div>
                    </div>
                    <div class="content">${result.content}</div>
                    <div class="explanation">${result.explanation}</div>
                </div>
            `).join('');

            resultsContent.innerHTML = resultsHtml;
        }

        // Initialize the app when page loads
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
