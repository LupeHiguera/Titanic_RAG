# AWS App Runner config — image-based deploy.
#
# This file is consumed by App Runner when the service is set up with
# "Source: Container registry" pointing at an ECR image of this Dockerfile.
# For source-based deploys (App Runner builds from GitHub) the equivalent
# settings live in the App Runner console.
#
# Required IAM (App Runner instance role) for DynamoDB cache:
#   {
#     "Effect": "Allow",
#     "Action": ["dynamodb:GetItem", "dynamodb:PutItem"],
#     "Resource": "arn:aws:dynamodb:<region>:<acct>:table/titanic-rag-contradictions"
#   }
#
# Required IAM (App Runner instance role) for secrets:
#   secretsmanager:GetSecretValue on each *_API_KEY secret referenced below.
#
# DynamoDB table setup (one-shot, outside this file):
#   aws dynamodb create-table \
#     --table-name titanic-rag-contradictions \
#     --attribute-definitions AttributeName=cache_key,AttributeType=S \
#     --key-schema AttributeName=cache_key,KeyType=HASH \
#     --billing-mode PAY_PER_REQUEST
#   aws dynamodb update-time-to-live \
#     --table-name titanic-rag-contradictions \
#     --time-to-live-specification "Enabled=true,AttributeName=expires_at"

version: 1.0
runtime: python3
run:
  runtime-version: 3.13
  command: uvicorn app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
  network:
    port: 8000
    env: PORT
  env:
    - name: CACHE_BACKEND
      value: dynamodb
    - name: CONTRADICTION_CACHE_TABLE
      value: titanic-rag-contradictions
    - name: PINECONE_INDEX_NAME
      value: titanic-rag
    - name: ALLOWED_ORIGINS
      value: https://titanic.higuera.io,https://www.titanic.higuera.io
    - name: RATE_LIMIT_SEARCH
      value: 30/minute
    - name: RATE_LIMIT_CONTRADICTIONS
      value: 10/minute
  secrets:
    - name: OPENAI_API_KEY
      value-from: arn:aws:secretsmanager:us-east-1:CHANGE_ME:secret:titanic-rag/openai
    - name: ANTHROPIC_API_KEY
      value-from: arn:aws:secretsmanager:us-east-1:CHANGE_ME:secret:titanic-rag/anthropic
    - name: PINECONE_API_KEY
      value-from: arn:aws:secretsmanager:us-east-1:CHANGE_ME:secret:titanic-rag/pinecone
